<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>My Spotify Profile</title>
        <script src="/bundle.js" defer></script>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header id="profile">
            <h1>Apply Set Operations on Playlists</h1>
            <div class="profile-user">
                <span>Logged in as <span id="displayName"></span></span>
                <a id="avatar" href="#" aria-label="Open Spotify profile"></a>
            </div>
        </header>
        <section id="set-ops">
        <h2>Set Operations</h2>

        <div class="playlist-row">
            <img id="set1-image" class="playlist-image">
            <select id="set1">
                <!--insert via script-->
            </select>
        </div>

        <div class="operation-row">
            <div id="select-flex-margin"></div>
            <select id="set-operation">
                <option value="union">Union</option>
                <option value="intersection">Intersection</option>
                <option value="difference">Difference</option>
                <option value="symmetric-difference">Symmetric Difference</option>
            </select>
            <select id="set-order">
                <option value="default">Default</option>
                <option value="interlaced">Interlaced</option>
                <option value="random">Random</option>
            </select>
        </div>

        <div class="playlist-row">
            <img id="set2-image" class="playlist-image">
            <select id="set2">
                <!--insert via script-->
            </select>
        </div>

        <div>
            <button id="apply-ops">Apply Operation</button>
        </div>

        <div>
            <p id="status" role="status" aria-live="polite"></p>
            <div id="loader" class="loader" hidden></div>
        </div>
        </section>

        <footer id="site-footer">
            <a href="https://github.com/Samocx/spotify-set-ops" target="_blank" rel="noopener noreferrer">
                View project on GitHub
            </a>
        </footer>
    </body>
</html>
